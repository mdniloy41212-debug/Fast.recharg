<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAST RECHARGE Customer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#18283b;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(120deg,#123e78,#1676c5);color:white;padding:22px}main{max-width:700px;margin:18px auto;padding:0 14px}.card{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #17385c12}h1{font-size:23px;margin:0}h2{font-size:18px}label{display:block;margin:10px 0 5px;font-weight:650}input,button{width:100%;padding:12px;border:1px solid #cbd7e5;border-radius:10px;font:inherit}button{background:#176fc0;color:white;border:0;margin-top:12px;font-weight:bold}.alt{background:#e8f1fb;color:#174b7b}.hidden{display:none}.pkg,.item{border:1px solid #d7e2ef;border-radius:10px;padding:12px;margin:8px 0}.pkg.sel{border:2px solid #1676c5;background:#edf6ff}.note{background:#fff7e6;padding:12px;border-radius:10px;font-size:13px;line-height:1.6}
</style><header><h1>⚡ FAST RECHARGE</h1>কাস্টমার অ্যাপ</header><main>
<section class="card" id="auth"><div id="signup"><h2>নতুন অ্যাকাউন্ট</h2><label>নাম</label><input id="name"><label>মোবাইল</label><input id="phone"><label>পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="password" type="password"><button onclick="signup()">সাইন আপ</button><button class="alt" onclick="toggle(false)">আগে অ্যাকাউন্ট আছে? লগইন</button></div>
<div id="login" class="hidden"><h2>কাস্টমার লগইন</h2><label>মোবাইল</label><input id="lphone"><label>পাসওয়ার্ড</label><input id="lpass" type="password"><button onclick="login()">লগইন</button><button class="alt" onclick="toggle(true)">নতুন অ্যাকাউন্ট খুলুন</button></div></section>
<section class="card hidden" id="shop"><h2 id="welcome">প্যাকেজ</h2><div id="packages"></div><label>IMO ID</label><input id="imo"><button onclick="order()">অর্ডার দিন</button><h2>আমার অর্ডার</h2><div id="history"></div><button class="alt" onclick="logout()">লগআউট</button></section>
<section class="card note">এই সংস্করণটি API-সংযুক্ত করার জন্য তৈরি। সার্ভার চালু ও অনলাইনে deploy না করা পর্যন্ত আলাদা ফোনে ব্যবহার করা যাবে না। এখানে কোনো বাস্তব রিচার্জ বা পেমেন্ট সম্পন্ন হয় না।</section></main>
<script>
let token='',selected=null,ps=[];
async function api(url,opt={}){let r=await fetch('/api'+url,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.error||'সমস্যা হয়েছে');return d}
function toggle(s){signupBox.classList.toggle('hidden',!s);loginBox.classList.toggle('hidden',s)}
const signupBox=document.getElementById('signup'),loginBox=document.getElementById('login');
async function signup(){try{await api('/customer/signup',{method:'POST',body:JSON.stringify({name:name.value,phone:phone.value,password:password.value})});alert('অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করুন।');toggle(false)}catch(e){alert(e.message)}}
async function login(){try{let d=await api('/customer/login',{method:'POST',body:JSON.stringify({phone:lphone.value,password:lpass.value})});token=d.token;auth.classList.add('hidden');shop.classList.remove('hidden');welcome.textContent='স্বাগতম, '+d.user.name;await load()}catch(e){alert(e.message)}}
async function load(){try{ps=await api('/packages');packages.innerHTML=ps.map(p=>`<div class="pkg ${selected===p.id?'sel':''}" onclick="selected=${p.id};load()"><b>${esc(p.title)}</b><br>৳ ${p.price}</div>`).join('')||'প্যাকেজ নেই';let h=await api('/orders/mine');history.innerHTML=h.map(o=>`<div class="item">#${o.id} — ${esc(o.package)} — ৳${o.price}<br>IMO: ${esc(o.imoId)}<br>অবস্থা: ${esc(o.status)}</div>`).join('')||'অর্ডার নেই'}catch(e){alert(e.message)}}
async function order(){try{if(!selected||!imo.value.trim())throw Error('প্যাকেজ ও IMO ID দিন');await api('/orders',{method:'POST',body:JSON.stringify({packageId:selected,imoId:imo.value})});alert('অর্ডার জমা হয়েছে');await load()}catch(e){alert(e.message)}}
function logout(){token='';selected=null;shop.classList.add('hidden');auth.classList.remove('hidden');toggle(false)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></html>
