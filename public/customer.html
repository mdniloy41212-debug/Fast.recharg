
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAST RECHARGE</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: #1d293b;
      padding: 20px;
      border-radius: 14px;
    }

    h1, h2 { text-align: center; color: #35d6a0; }

    input, button, select {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select { background: white; color: #111; }

    button {
      background: #12b981;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary { background: #3478f6; }

    .card {
      background: #26364d;
      padding: 14px;
      border-radius: 10px;
      margin: 14px 0;
    }

    .hidden { display: none; }

    #message {
      white-space: pre-wrap;
      color: #ffd166;
    }

    .order {
      border-bottom: 1px solid #526078;
      padding: 12px 0;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>FAST RECHARGE</h1>
    <p id="message"></p>

    <section id="auth">
      <div class="card">
        <h2>Create Account</h2>
        <input id="signupName" placeholder="আপনার নাম">
        <input id="signupPhone" placeholder="মোবাইল নম্বর">
        <input id="signupPassword" type="password" placeholder="Password">
        <button onclick="signup()">Create Account</button>
      </div>

      <div class="card">
        <h2>Customer Login</h2>
        <input id="loginPhone" placeholder="মোবাইল নম্বর">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
      </div>
    </section>

    <section id="shop" class="hidden">
      <h2>Diamond Recharge</h2>
      <button class="secondary" onclick="logout()">Logout</button>

      <div class="card">
        <h3>Package নির্বাচন করুন</h3>
        <select id="packageSelect"></select>
        <input id="imoId" placeholder="আপনার IMO ID">
        <button onclick="createOrder()">অর্ডার করুন</button>
      </div>

      <div class="card">
        <h3>আমার অর্ডার</h3>
        <button class="secondary" onclick="loadOrders()">Refresh Orders</button>
        <div id="orders">অর্ডার লোড হচ্ছে...</div>
      </div>
    </section>
  </div>

<script>
const API = "";
let token = localStorage.getItem("fastRechargeToken") || "";

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

async function request(url, options = {}) {
  const headers = {
    "Content-Type": "application/json",
    ...(token ? { Authorization: "Bearer " + token } : {}),
    ...(options.headers || {})
  };

  const response = await fetch(API + url, {
    ...options,
    headers
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || data.message || "Request failed");
  }

  return data;
}

async function signup() {
  try {
    const name = document.getElementById("signupName").value.trim();
    const phone = document.getElementById("signupPhone").value.trim();
    const password = document.getElementById("signupPassword").value;

    if (!name || !phone || !password) {
      return showMessage("নাম, মোবাইল নম্বর ও Password লিখুন।");
    }

    const data = await request("/api/customer/signup", {
      method: "POST",
      body: JSON.stringify({ name, phone, password })
    });

    showMessage(data.message || "Account তৈরি হয়েছে। এবার Login করুন।");
  } catch (error) {
    showMessage(error.message);
  }
}

async function login() {
  try {
    const phone = document.getElementById("loginPhone").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!phone || !password) {
      return showMessage("মোবাইল নম্বর ও Password লিখুন।");
    }

    const data = await request("/api/customer/login", {
      method: "POST",
      body: JSON.stringify({ phone, password })
    });

    if (!data.token) {
      throw new Error("Login token পাওয়া যায়নি।");
    }

    token = data.token;
    localStorage.setItem("fastRechargeToken", token);

    document.getElementById("auth").classList.add("hidden");
    document.getElementById("shop").classList.remove("hidden");

    await loadPackages();
    await loadOrders();

    showMessage("Login সফল হয়েছে।");
  } catch (error) {
    showMessage(error.message);
  }
}

async function loadPackages() {
  try {
    const data = await request("/api/packages");
    const packages = Array.isArray(data) ? data : data.packages || [];
    const select = document.getElementById("packageSelect");

    select.innerHTML = "";

    if (!packages.length) {
      select.innerHTML = "<option value=''>কোনো Package নেই</option>";
      return;
    }

    packages.forEach(item => {
      const option = document.createElement("option");
      option.value = item.id;
      option.textContent = item.title + " - ৳" + item.price;
      select.appendChild(option);
    });
  } catch (error) {
    showMessage("Package লোড হয়নি: " + error.message);
  }
}

async function createOrder() {
  try {
    const packageId = document.getElementById("packageSelect").value;
    const imoId = document.getElementById("imoId").value.trim();

    if (!packageId || !imoId) {
      return showMessage("Package এবং IMO ID দিন।");
    }

    const data = await request("/api/orders", {
      method: "POST",
      body: JSON.stringify({ packageId, imoId })
    });

    document.getElementById("imoId").value = "";

    showMessage("অর্ডার তৈরি হয়েছে। Order ID: " + data.id);

    await loadOrders();
  } catch (error) {
    showMessage("অর্ডার হয়নি: " + error.message);
  }
}

async function loadOrders() {
  try {
    const data = await request("/api/orders/mine");
    const orders = Array.isArray(data) ? data : data.orders || [];
    const box = document.getElementById("orders");

    box.innerHTML = "";

    if (!orders.length) {
      box.textContent = "এখনো কোনো অর্ডার নেই।";
      return;
    }

    orders.forEach(order => {
      const item = document.createElement("div");
      item.className = "order";

      const title = document.createElement("strong");
      title.textContent = "Order ID: " + order.id;

      const details = document.createElement("p");
      details.textContent =
        "Package: " + order.package +
        " | Price: ৳" + order.price +
        " | IMO ID: " + order.imoId;

      const status = document.createElement("p");
      status.textContent = "Status: " + order.status;

      item.append(title, details, status);
      box.appendChild(item);
    });
  } catch (error) {
    showMessage("অর্ডার লোড হয়নি: " + error.message);
  }
}

function logout() {
  token = "";
  localStorage.removeItem("fastRechargeToken");

  document.getElementById("shop").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");

  document.getElementById("orders").innerHTML = "";
  showMessage("Logout হয়েছে।");
}

if (token) {
  loginWithSavedToken();
}

async function loginWithSavedToken() {
  try {
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("shop").classList.remove("hidden");

    await loadPackages();
    await loadOrders();
  } catch (error) {
    logout();
    showMessage("আবার Login করুন।");
  }
}
</script>
</body>
</html>
